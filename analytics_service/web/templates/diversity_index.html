<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musical Diversity Index - Portfolio Analysis</title>
    
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1 {
            color: #1db954;
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #b3b3b3;
            font-size: 18px;
            margin-bottom: 30px;
        }
        
        .controls {
            background: #282828;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: #282828;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        
        .metric-card:hover {
            border-color: #1db954;
        }
        
        .metric-value {
            font-size: 36px;
            font-weight: bold;
            color: #1db954;
            margin-bottom: 5px;
        }
        
        .metric-label {
            font-size: 14px;
            color: #b3b3b3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .metric-change {
            font-size: 16px;
            margin-top: 10px;
        }
        
        .metric-change.positive {
            color: #4caf50;
        }
        
        .metric-change.negative {
            color: #f44336;
        }
        
        .visualization-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .viz-card {
            background: #282828;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        .viz-card.full-width {
            grid-column: span 2;
        }
        
        .chart-container {
            width: 100%;
            height: 400px;
        }
        
        .recommendations {
            background: #282828;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .recommendations h2 {
            color: #1db954;
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .recommendation-item {
            background: #121212;
            border-left: 4px solid #1db954;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        
        .risk-indicator {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .risk-low {
            background: #4caf50;
            color: white;
        }
        
        .risk-moderate {
            background: #ff9800;
            color: white;
        }
        
        .risk-high {
            background: #f44336;
            color: white;
        }
        
        label {
            color: #b3b3b3;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 10px;
        }
        
        select {
            background: #121212;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
        
        button {
            background: #1db954;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: #1ed760;
            transform: scale(1.05);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #b3b3b3;
        }
        
        @media (max-width: 768px) {
            .visualization-grid {
                grid-template-columns: 1fr;
            }
            
            .viz-card.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Musical Diversity Index</h1>
        <p class="subtitle">Analyze your music portfolio like a financial investment</p>
        
        <div class="controls">
            <div>
                <label for="period">Analysis Period:</label>
                <select id="period" onchange="updatePeriod()">
                    <option value="7">Last Week</option>
                    <option value="30" selected>Last Month</option>
                    <option value="90">Last 3 Months</option>
                    <option value="365">Last Year</option>
                </select>
            </div>
            
            <button onclick="loadPortfolioData()">Refresh Analysis</button>
            <button onclick="exportReport()">Export Report</button>
        </div>
        
        <div class="metrics-grid" id="metricsGrid">
            <div class="loading">Loading portfolio metrics...</div>
        </div>
        
        <div class="recommendations" id="recommendations" style="display: none;">
            <h2>Diversification Recommendations</h2>
            <div id="recommendationsList"></div>
        </div>
        
        <div class="visualization-grid">
            <div class="viz-card">
                <div id="portfolioChart" class="chart-container"></div>
            </div>
            
            <div class="viz-card">
                <div id="riskReturnChart" class="chart-container"></div>
            </div>
            
            <div class="viz-card full-width">
                <div id="performanceChart" class="chart-container"></div>
            </div>
        </div>
    </div>
    
    <script>
        let currentData = null;
        
        // Initialize on page load
        window.onload = function() {
            loadPortfolioData();
        };
        
        function updatePeriod() {
            loadPortfolioData();
        }
        
        async function loadPortfolioData() {
            try {
                showLoading();
                
                const period = document.getElementById('period').value;
                const response = await fetch(`/api/visualizations/genre-portfolio?days=${period}`);
                currentData = await response.json();
                
                // Update metrics
                displayMetrics();
                
                // Update recommendations
                displayRecommendations();
                
                // Update visualizations
                updateVisualizations();
                
            } catch (error) {
                console.error('Error loading portfolio data:', error);
                alert('Failed to load portfolio data. Please try again.');
            }
        }
        
        function showLoading() {
            document.getElementById('metricsGrid').innerHTML = '<div class="loading">Loading portfolio metrics...</div>';
            document.getElementById('portfolioChart').innerHTML = '<div class="loading">Loading...</div>';
            document.getElementById('riskReturnChart').innerHTML = '<div class="loading">Loading...</div>';
            document.getElementById('performanceChart').innerHTML = '<div class="loading">Loading...</div>';
        }
        
        function displayMetrics() {
            const metrics = currentData.diversity_score.metrics;
            const riskLevel = currentData.diversity_score.risk_level;
            const trend = currentData.risk_metrics.trend;
            
            const metricsHtml = `
                <div class="metric-card">
                    <div class="metric-value">${currentData.diversity_score.score.toFixed(0)}</div>
                    <div class="metric-label">Diversity Score</div>
                    <div class="risk-indicator risk-${riskLevel}">${riskLevel} risk</div>
                </div>
                
                <div class="metric-card">
                    <div class="metric-value">${metrics.genre_count}</div>
                    <div class="metric-label">Active Genres</div>
                    <div class="metric-change ${metrics.genre_count >= 5 ? 'positive' : 'negative'}">
                        ${metrics.genre_count >= 5 ? '✓ Diverse' : '⚠ Limited'}
                    </div>
                </div>
                
                <div class="metric-card">
                    <div class="metric-value">${currentData.risk_metrics.consistency.toFixed(0)}%</div>
                    <div class="metric-label">Consistency</div>
                    <div class="metric-change ${trend === 'improving' ? 'positive' : trend === 'declining' ? 'negative' : ''}">
                        ${trend === 'improving' ? '↑' : trend === 'declining' ? '↓' : '→'} ${trend}
                    </div>
                </div>
                
                <div class="metric-card">
                    <div class="metric-value">${metrics.top_3_concentration.toFixed(0)}%</div>
                    <div class="metric-label">Top 3 Concentration</div>
                    <div class="metric-change ${metrics.top_3_concentration < 70 ? 'positive' : 'negative'}">
                        ${metrics.top_3_concentration < 70 ? '✓ Balanced' : '⚠ Concentrated'}
                    </div>
                </div>
                
                <div class="metric-card">
                    <div class="metric-value">${currentData.risk_metrics.volatility.toFixed(1)}</div>
                    <div class="metric-label">Volatility</div>
                    <div class="metric-change ${currentData.risk_metrics.volatility < 10 ? 'positive' : 'negative'}">
                        ${currentData.risk_metrics.volatility < 10 ? '✓ Stable' : '⚠ Volatile'}
                    </div>
                </div>
                
                <div class="metric-card">
                    <div class="metric-value">${currentData.total_plays}</div>
                    <div class="metric-label">Total Plays</div>
                    <div class="metric-change">Last ${currentData.period_days} days</div>
                </div>
            `;
            
            document.getElementById('metricsGrid').innerHTML = metricsHtml;
        }
        
        function displayRecommendations() {
            const recommendations = currentData.recommendations;
            
            if (recommendations && recommendations.length > 0) {
                document.getElementById('recommendations').style.display = 'block';
                
                const recsHtml = recommendations.map(rec => `
                    <div class="recommendation-item">
                        ${rec}
                    </div>
                `).join('');
                
                document.getElementById('recommendationsList').innerHTML = recsHtml;
            } else {
                document.getElementById('recommendations').style.display = 'none';
            }
        }
        
        async function updateVisualizations() {
            // Portfolio donut chart
            const portfolioResponse = await fetch('/api/visualizations/portfolio-chart', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    portfolio: currentData.portfolio,
                    diversity_score: currentData.diversity_score.score
                })
            }).catch(() => null);
            
            if (portfolioResponse) {
                const portfolioData = await portfolioResponse.json();
                if (portfolioData.chart) {
                    Plotly.newPlot('portfolioChart', portfolioData.chart.data, portfolioData.chart.layout);
                }
            } else {
                // Fallback to client-side rendering
                createPortfolioChart();
            }
            
            // Risk/Return scatter
            createRiskReturnChart();
            
            // Performance chart
            createPerformanceChart();
        }
        
        function createPortfolioChart() {
            const assets = currentData.portfolio.assets;
            
            const data = [{
                values: assets.map(a => a.percentage),
                labels: assets.map(a => a.genre.charAt(0).toUpperCase() + a.genre.slice(1)),
                type: 'pie',
                hole: 0.7,
                marker: {
                    colors: assets.map(a => a.color),
                    line: { color: '#121212', width: 2 }
                },
                textinfo: 'label+percent',
                textposition: 'outside'
            }];
            
            const layout = {
                title: 'Genre Portfolio Allocation',
                annotations: [{
                    text: `<b>${currentData.diversity_score.score.toFixed(0)}</b><br>Score`,
                    x: 0.5, y: 0.5,
                    font: { size: 24, color: '#1db954' },
                    showarrow: false
                }],
                paper_bgcolor: '#282828',
                plot_bgcolor: '#282828',
                font: { color: '#ffffff' }
            };
            
            Plotly.newPlot('portfolioChart', data, layout);
        }
        
        function createRiskReturnChart() {
            const assets = currentData.portfolio.assets;
            const volatilities = currentData.risk_metrics.genre_volatilities || {};
            
            const data = [{
                x: assets.map(a => volatilities[a.genre] || 5),
                y: assets.map(a => a.percentage),
                text: assets.map(a => a.genre.charAt(0).toUpperCase() + a.genre.slice(1)),
                mode: 'markers+text',
                type: 'scatter',
                marker: {
                    size: assets.map(a => 10 + (a.play_count / currentData.total_plays) * 50),
                    color: assets.map(a => a.color),
                    line: { color: 'white', width: 2 }
                },
                textposition: 'top center'
            }];
            
            const layout = {
                title: 'Genre Risk vs Return',
                xaxis: { title: 'Volatility (Risk)' },
                yaxis: { title: 'Portfolio Share (%)' },
                paper_bgcolor: '#282828',
                plot_bgcolor: '#282828',
                font: { color: '#ffffff' }
            };
            
            Plotly.newPlot('riskReturnChart', data, layout);
        }
        
        function createPerformanceChart() {
            const historical = currentData.historical_performance;
            if (!historical || historical.length === 0) {
                document.getElementById('performanceChart').innerHTML = 
                    '<div class="loading">Not enough historical data</div>';
                return;
            }
            
            // Get all genres
            const allGenres = new Set();
            historical.forEach(week => {
                week.assets.forEach(asset => allGenres.add(asset.genre));
            });
            
            // Create traces for each genre
            const traces = [];
            allGenres.forEach(genre => {
                const x = historical.map(w => w.week);
                const y = historical.map(w => {
                    const asset = w.assets.find(a => a.genre === genre);
                    return asset ? asset.percentage : 0;
                });
                
                traces.push({
                    x: x,
                    y: y,
                    name: genre.charAt(0).toUpperCase() + genre.slice(1),
                    type: 'scatter',
                    mode: 'lines+markers',
                    line: { width: 3 }
                });
            });
            
            const layout = {
                title: 'Genre Performance Over Time',
                xaxis: { title: 'Week', type: 'date' },
                yaxis: { title: 'Portfolio Share (%)', range: [0, 100] },
                hovermode: 'x unified',
                paper_bgcolor: '#282828',
                plot_bgcolor: '#282828',
                font: { color: '#ffffff' }
            };
            
            Plotly.newPlot('performanceChart', traces, layout);
        }
        
        function exportReport() {
            if (!currentData) {
                alert('No data to export');
                return;
            }
            
            const report = {
                generated: new Date().toISOString(),
                period_days: currentData.period_days,
                diversity_score: currentData.diversity_score,
                portfolio: currentData.portfolio,
                risk_metrics: currentData.risk_metrics,
                recommendations: currentData.recommendations
            };
            
            const dataStr = JSON.stringify(report, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `music_diversity_report_${new Date().toISOString().split('T')[0]}.json`;
            link.click();
        }
    </script>
</body>
</html>
