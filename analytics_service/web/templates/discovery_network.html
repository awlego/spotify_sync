<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discovery Network - Musical Evolution</title>
    
    <!-- D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1 {
            color: #1db954;
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #b3b3b3;
            font-size: 18px;
            margin-bottom: 30px;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }
        
        .network-container {
            background: #282828;
            border-radius: 8px;
            padding: 20px;
            position: relative;
            min-height: 700px;
        }
        
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .info-panel {
            background: #282828;
            border-radius: 8px;
            padding: 20px;
        }
        
        .info-panel h2 {
            color: #1db954;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 15px;
        }
        
        .discovery-chains {
            background: #282828;
            border-radius: 8px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .chain-item {
            background: #121212;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .chain-item .artists {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
            flex-wrap: wrap;
        }
        
        .chain-arrow {
            color: #1db954;
            font-size: 18px;
        }
        
        .artist-node {
            background: #404040;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
        }
        
        .controls {
            background: #282828;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .control-group {
            display: inline-block;
            margin-right: 20px;
        }
        
        label {
            color: #b3b3b3;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 10px;
        }
        
        select, input[type="date"] {
            background: #121212;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
        
        button {
            background: #1db954;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: #1ed760;
            transform: scale(1.05);
        }
        
        .path-finder {
            background: #282828;
            border-radius: 8px;
            padding: 20px;
        }
        
        .path-finder input {
            width: 100%;
            margin-bottom: 10px;
        }
        
        .selected-artist {
            background: #121212;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        
        .selected-artist h3 {
            color: #1db954;
            margin-top: 0;
        }
        
        .artist-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 14px;
        }
        
        .stat-item {
            color: #b3b3b3;
        }
        
        .stat-value {
            color: #ffffff;
            font-weight: 600;
        }
        
        #network-graph {
            width: 100%;
            height: 600px;
            position: relative;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #b3b3b3;
        }
        
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Discovery Network</h1>
        <p class="subtitle">Explore how your musical taste evolved over time</p>
        
        <div class="controls">
            <div class="control-group">
                <label for="time-period">Time Period:</label>
                <select id="time-period" onchange="updateTimePeriod()">
                    <option value="30">Last 30 days</option>
                    <option value="90">Last 90 days</option>
                    <option value="365" selected>Last year</option>
                    <option value="all">All time</option>
                </select>
            </div>
            
            <button onclick="loadNetwork()">Refresh Network</button>
            <button onclick="exportNetwork()">Export Data</button>
        </div>
        
        <div class="main-content">
            <div class="network-container">
                <div id="network-graph">
                    <div class="loading">Loading your discovery network...</div>
                </div>
            </div>
            
            <div class="sidebar">
                <div class="info-panel">
                    <h2>Selected Artist</h2>
                    <div id="selected-artist-info">
                        <p style="color: #b3b3b3; font-size: 14px;">
                            Click on an artist to see details
                        </p>
                    </div>
                </div>
                
                <div class="path-finder">
                    <h2 style="color: #1db954; font-size: 18px; margin-top: 0;">Find Connection</h2>
                    <input type="text" id="artist1" placeholder="From artist...">
                    <input type="text" id="artist2" placeholder="To artist...">
                    <button onclick="findPath()" style="width: 100%;">Find Path</button>
                </div>
                
                <div class="discovery-chains">
                    <h2 style="color: #1db954; font-size: 18px; margin-top: 0;">Discovery Chains</h2>
                    <div id="chains-list">
                        <p style="color: #b3b3b3; font-size: 14px;">
                            Loading discovery patterns...
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/visualizations/discovery-network.js"></script>
    <script>
        let network;
        let currentData = null;
        
        // Initialize on page load
        window.onload = function() {
            // Create network visualization
            network = new DiscoveryNetwork('network-graph');
            
            // Load initial data
            loadNetwork();
            
            // Listen for node selection
            document.getElementById('network-graph').addEventListener('nodeSelected', (e) => {
                displayArtistInfo(e.detail);
            });
        };
        
        function updateTimePeriod() {
            // Time period changed, reload network
            loadNetwork();
        }
        
        async function loadNetwork() {
            const period = document.getElementById('time-period').value;
            let startDate, endDate;
            
            if (period !== 'all') {
                endDate = new Date();
                startDate = new Date();
                startDate.setDate(endDate.getDate() - parseInt(period));
                startDate = startDate.toISOString();
                endDate = endDate.toISOString();
            }
            
            // Clear previous visualization
            document.getElementById('network-graph').innerHTML = '<div class="loading">Loading your discovery network...</div>';
            
            // Recreate network
            network = new DiscoveryNetwork('network-graph');
            
            // Load data
            await network.loadData();
            
            // Fetch full data for chains
            try {
                const params = new URLSearchParams();
                if (startDate) params.append('start_date', startDate);
                if (endDate) params.append('end_date', endDate);
                
                const response = await fetch(`/api/visualizations/discovery-network?${params}`);
                currentData = await response.json();
                
                displayDiscoveryChains(currentData.discovery_chains);
            } catch (error) {
                console.error('Error loading network data:', error);
            }
        }
        
        function displayArtistInfo(artist) {
            const container = document.getElementById('selected-artist-info');
            const formatDate = d3.timeFormat('%B %d, %Y');
            const discovered = new Date(artist.discovered);
            
            container.innerHTML = `
                <div class="selected-artist">
                    <h3>${artist.name}</h3>
                    <div class="artist-stats">
                        <div class="stat-item">
                            Discovered: <span class="stat-value">${formatDate(discovered)}</span>
                        </div>
                        <div class="stat-item">
                            First Track: <span class="stat-value">${artist.first_track}</span>
                        </div>
                        <div class="stat-item">
                            Total Plays: <span class="stat-value">${artist.play_count}</span>
                        </div>
                        <div class="stat-item">
                            Days Active: <span class="stat-value">${artist.days_active}</span>
                        </div>
                        <div class="stat-item">
                            Play Density: <span class="stat-value">${artist.play_density}/day</span>
                        </div>
                        <div class="stat-item">
                            Importance: <span class="stat-value">${(artist.importance * 100).toFixed(0)}%</span>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function displayDiscoveryChains(chains) {
            const container = document.getElementById('chains-list');
            
            if (!chains || chains.length === 0) {
                container.innerHTML = '<p style="color: #b3b3b3; font-size: 14px;">No discovery chains found</p>';
                return;
            }
            
            let html = '';
            chains.forEach((chain, i) => {
                html += `
                    <div class="chain-item">
                        <strong>Chain ${i + 1}</strong> (${chain.length} artists)
                        <div class="artists">
                `;
                
                chain.artists.forEach((artist, j) => {
                    if (j > 0) html += '<span class="chain-arrow">→</span>';
                    html += `<span class="artist-node">${artist.name}</span>`;
                });
                
                html += `
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        async function findPath() {
            const artist1 = document.getElementById('artist1').value;
            const artist2 = document.getElementById('artist2').value;
            
            if (!artist1 || !artist2) {
                alert('Please enter both artist names');
                return;
            }
            
            await network.findPath(artist1, artist2);
        }
        
        function exportNetwork() {
            if (!currentData) {
                alert('No data to export');
                return;
            }
            
            const dataStr = JSON.stringify(currentData, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `discovery_network_${new Date().toISOString().split('T')[0]}.json`;
            link.click();
        }
    </script>
</body>
</html>
