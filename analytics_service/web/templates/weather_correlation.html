<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather-Music Correlation - How Weather Affects Your Listening</title>
    
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    
    <!-- Mapbox for location visualization -->
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1 {
            color: #1db954;
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #b3b3b3;
            font-size: 18px;
            margin-bottom: 30px;
        }
        
        .controls {
            background: #282828;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .current-weather {
            background: #282828;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .weather-background {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            opacity: 0.1;
            background-size: cover;
            background-position: center;
            filter: blur(20px);
        }
        
        .weather-content {
            position: relative;
            z-index: 1;
        }
        
        .weather-icon {
            font-size: 72px;
            margin-bottom: 20px;
        }
        
        .weather-temp {
            font-size: 48px;
            font-weight: bold;
            color: #1db954;
            margin-bottom: 10px;
        }
        
        .weather-desc {
            font-size: 24px;
            color: #b3b3b3;
            margin-bottom: 30px;
        }
        
        .predictions {
            background: rgba(29, 185, 84, 0.1);
            border-left: 4px solid #1db954;
            border-radius: 4px;
            padding: 20px;
            margin: 20px auto;
            max-width: 600px;
            text-align: left;
        }
        
        .predictions h3 {
            color: #1db954;
            margin-bottom: 15px;
        }
        
        .prediction-item {
            margin-bottom: 10px;
            font-size: 16px;
            line-height: 1.5;
        }
        
        .visualization-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .viz-card {
            background: #282828;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        .chart-container {
            width: 100%;
            height: 500px;
        }
        
        .correlation-insights {
            background: #282828;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .insight-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 15px;
            background: #121212;
            border-radius: 4px;
        }
        
        .insight-icon {
            font-size: 24px;
            margin-right: 15px;
        }
        
        .map-container {
            width: 100%;
            height: 400px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        label {
            color: #b3b3b3;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: 10px;
        }
        
        select, input {
            background: #121212;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
        
        button {
            background: #1db954;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: #1ed760;
            transform: scale(1.05);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #b3b3b3;
        }
        
        .weather-clear { background: linear-gradient(135deg, #FFD700, #FFA500); }
        .weather-cloudy { background: linear-gradient(135deg, #778899, #696969); }
        .weather-rainy { background: linear-gradient(135deg, #4682B4, #191970); }
        .weather-stormy { background: linear-gradient(135deg, #483D8B, #2F4F4F); }
        .weather-snowy { background: linear-gradient(135deg, #F0F8FF, #B0C4DE); }
        .weather-misty { background: linear-gradient(135deg, #C0C0C0, #808080); }
        
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                gap: 10px;
            }
            
            .chart-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Weather-Music Correlation</h1>
        <p class="subtitle">Discover how weather conditions influence your music choices</p>
        
        <div class="controls">
            <div>
                <label for="period">Analysis Period:</label>
                <select id="period" onchange="updateAnalysis()">
                    <option value="30">Last Month</option>
                    <option value="90" selected>Last 3 Months</option>
                    <option value="180">Last 6 Months</option>
                    <option value="365">Last Year</option>
                </select>
            </div>
            
            <div>
                <label for="location">Location:</label>
                <select id="location" onchange="updateLocation()">
                    <option value="auto">Auto-detect</option>
                    <option value="custom">Custom</option>
                </select>
            </div>
            
            <div id="customLocation" style="display: none;">
                <input type="number" id="lat" placeholder="Latitude" step="0.0001" style="width: 100px;">
                <input type="number" id="lon" placeholder="Longitude" step="0.0001" style="width: 100px;">
            </div>
            
            <button onclick="loadWeatherData()">Analyze</button>
            <button onclick="refreshPredictions()">Get Current Predictions</button>
        </div>
        
        <!-- Current Weather & Predictions -->
        <div class="current-weather" id="currentWeather">
            <div class="weather-background" id="weatherBg"></div>
            <div class="weather-content">
                <div class="loading">Loading weather data...</div>
            </div>
        </div>
        
        <!-- Correlation Insights -->
        <div class="correlation-insights" id="insights" style="display: none;">
            <h2>Key Insights</h2>
            <div id="insightsList"></div>
        </div>
        
        <!-- Visualizations -->
        <div class="visualization-grid">
            <!-- Correlation Matrix -->
            <div class="viz-card">
                <h3>Weather-Music Correlations</h3>
                <div id="correlationMatrix" class="chart-container"></div>
            </div>
            
            <!-- Weather Patterns -->
            <div class="viz-card">
                <h3>Music Patterns by Weather</h3>
                <div id="weatherPatterns" class="chart-container"></div>
            </div>
            
            <!-- Location Map -->
            <div class="viz-card">
                <h3>Listening Activity Map</h3>
                <div id="locationMap" class="map-container"></div>
            </div>
        </div>
    </div>
    
    <script>
        let currentData = null;
        let userLocation = null;
        
        // Weather icons mapping
        const weatherIcons = {
            'clear': '☀️',
            'cloudy': '☁️',
            'rainy': '🌧️',
            'stormy': '⛈️',
            'snowy': '❄️',
            'misty': '🌫️'
        };
        
        // Initialize on page load
        window.onload = function() {
            detectLocation();
            loadWeatherData();
        };
        
        function detectLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation = {
                            lat: position.coords.latitude,
                            lon: position.coords.longitude
                        };
                    },
                    (error) => {
                        console.error('Error getting location:', error);
                        // Default to New York
                        userLocation = { lat: 40.7128, lon: -74.0060 };
                    }
                );
            }
        }
        
        function updateLocation() {
            const location = document.getElementById('location').value;
            if (location === 'custom') {
                document.getElementById('customLocation').style.display = 'block';
            } else {
                document.getElementById('customLocation').style.display = 'none';
            }
        }
        
        function updateAnalysis() {
            loadWeatherData();
        }
        
        async function loadWeatherData() {
            try {
                showLoading();
                
                const period = document.getElementById('period').value;
                const location = document.getElementById('location').value;
                
                let params = `days=${period}`;
                
                if (location === 'custom') {
                    const lat = document.getElementById('lat').value;
                    const lon = document.getElementById('lon').value;
                    if (lat && lon) {
                        params += `&lat=${lat}&lon=${lon}`;
                    }
                } else if (userLocation) {
                    params += `&lat=${userLocation.lat}&lon=${userLocation.lon}`;
                }
                
                const response = await fetch(`/api/visualizations/weather-correlation?${params}`);
                currentData = await response.json();
                
                if (currentData.error) {
                    alert('Error loading data: ' + currentData.error);
                    return;
                }
                
                // Update all visualizations
                updateCurrentWeather();
                updateInsights();
                updateVisualizations();
                
            } catch (error) {
                console.error('Error loading weather data:', error);
                alert('Failed to load weather data. Please try again.');
            }
        }
        
        function showLoading() {
            document.querySelector('.weather-content').innerHTML = '<div class="loading">Loading weather data...</div>';
            document.getElementById('correlationMatrix').innerHTML = '<div class="loading">Loading...</div>';
            document.getElementById('weatherPatterns').innerHTML = '<div class="loading">Loading...</div>';
            document.getElementById('locationMap').innerHTML = '<div class="loading">Loading...</div>';
        }
        
        function updateCurrentWeather() {
            if (!currentData || !currentData.predictions) return;
            
            const predictions = currentData.predictions;
            const weather = predictions.weather || 'unknown';
            const temp = predictions.temperature || 'N/A';
            const desc = predictions.description || 'No data';
            const suggestions = predictions.suggestions || [];
            const confidence = predictions.confidence || 0;
            
            // Update background
            const weatherBg = document.getElementById('weatherBg');
            weatherBg.className = `weather-background weather-${weather}`;
            
            // Update content
            const weatherContent = document.querySelector('.weather-content');
            weatherContent.innerHTML = `
                <div class="weather-icon">${weatherIcons[weather] || '🌈'}</div>
                <div class="weather-temp">${temp}°C</div>
                <div class="weather-desc">${desc}</div>
                
                <div class="predictions">
                    <h3>Music Recommendations</h3>
                    ${suggestions.map(s => `<div class="prediction-item">${s}</div>`).join('')}
                    <div style="margin-top: 15px; color: #b3b3b3; font-size: 14px;">
                        Confidence: ${(confidence * 100).toFixed(0)}%
                    </div>
                </div>
            `;
        }
        
        function updateInsights() {
            if (!currentData || !currentData.correlations) return;
            
            const insights = [];
            const correlations = currentData.correlations;
            
            // Find strongest correlations
            for (const [weatherFeature, audioData] of Object.entries(correlations)) {
                for (const [audioFeature, corrData] of Object.entries(audioData)) {
                    if (corrData.significant && Math.abs(corrData.correlation) > 0.3) {
                        const direction = corrData.correlation > 0 ? 'increases' : 'decreases';
                        insights.push({
                            icon: corrData.correlation > 0 ? '📈' : '📉',
                            text: `${weatherFeature.charAt(0).toUpperCase() + weatherFeature.slice(1)} ${direction} ${audioFeature}`
                        });
                    }
                }
            }
            
            if (insights.length > 0) {
                document.getElementById('insights').style.display = 'block';
                document.getElementById('insightsList').innerHTML = insights
                    .slice(0, 5)  // Show top 5 insights
                    .map(i => `
                        <div class="insight-item">
                            <div class="insight-icon">${i.icon}</div>
                            <div>${i.text}</div>
                        </div>
                    `).join('');
            }
        }
        
        async function updateVisualizations() {
            // 1. Correlation Matrix
            const corrResponse = await fetch('/api/visualizations/correlation-matrix', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({correlations: currentData.correlations})
            }).catch(() => null);
            
            if (corrResponse) {
                const corrData = await corrResponse.json();
                if (corrData.chart) {
                    Plotly.newPlot('correlationMatrix', corrData.chart.data, corrData.chart.layout);
                }
            } else {
                // Fallback to client-side rendering
                createCorrelationMatrix();
            }
            
            // 2. Weather Patterns
            const patternsResponse = await fetch('/api/visualizations/weather-patterns-chart', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({patterns: currentData.patterns})
            }).catch(() => null);
            
            if (patternsResponse) {
                const patternsData = await patternsResponse.json();
                if (patternsData.chart) {
                    Plotly.newPlot('weatherPatterns', patternsData.chart.data, patternsData.chart.layout);
                }
            } else {
                // Fallback to client-side rendering
                createWeatherPatterns();
            }
            
            // 3. Location Map
            createLocationMap();
        }
        
        function createCorrelationMatrix() {
            if (!currentData.correlations) return;
            
            const weatherFeatures = Object.keys(currentData.correlations);
            const audioFeatures = weatherFeatures.length > 0 ? 
                Object.keys(currentData.correlations[weatherFeatures[0]]) : [];
            
            const zValues = [];
            for (const wf of weatherFeatures) {
                const row = [];
                for (const af of audioFeatures) {
                    row.push(currentData.correlations[wf][af].correlation);
                }
                zValues.push(row);
            }
            
            const data = [{
                type: 'heatmap',
                z: zValues,
                x: audioFeatures.map(f => f.charAt(0).toUpperCase() + f.slice(1)),
                y: weatherFeatures.map(f => f.charAt(0).toUpperCase() + f.slice(1)),
                colorscale: [
                    [0, '#4575b4'],
                    [0.5, '#f7f7f7'],
                    [1, '#d73027']
                ],
                zmid: 0,
                colorbar: {
                    title: 'Correlation',
                    titleside: 'right'
                }
            }];
            
            const layout = {
                title: 'Weather-Music Correlations',
                paper_bgcolor: '#282828',
                plot_bgcolor: '#282828',
                font: { color: '#ffffff' },
                xaxis: { title: 'Audio Features' },
                yaxis: { title: 'Weather Features' }
            };
            
            Plotly.newPlot('correlationMatrix', data, layout);
        }
        
        function createWeatherPatterns() {
            if (!currentData.patterns) return;
            
            const weatherTypes = Object.keys(currentData.patterns);
            const playCounts = weatherTypes.map(w => currentData.patterns[w].play_count);
            
            const data = [{
                type: 'bar',
                x: weatherTypes,
                y: playCounts,
                marker: {
                    color: weatherTypes.map(w => {
                        const colors = {
                            'clear': '#FFD700',
                            'cloudy': '#778899',
                            'rainy': '#4682B4',
                            'stormy': '#483D8B',
                            'snowy': '#F0F8FF',
                            'misty': '#C0C0C0'
                        };
                        return colors[w] || '#808080';
                    })
                }
            }];
            
            const layout = {
                title: 'Play Count by Weather Type',
                paper_bgcolor: '#282828',
                plot_bgcolor: '#282828',
                font: { color: '#ffffff' },
                xaxis: { title: 'Weather Type' },
                yaxis: { title: 'Total Plays' }
            };
            
            Plotly.newPlot('weatherPatterns', data, layout);
        }
        
        function createLocationMap() {
            if (!currentData.location) return;
            
            const loc = currentData.location;
            
            const data = [{
                type: 'scattermapbox',
                lat: [loc.latitude],
                lon: [loc.longitude],
                mode: 'markers',
                marker: {
                    size: 15,
                    color: '#1db954'
                },
                text: ['Your Location']
            }];
            
            const layout = {
                mapbox: {
                    style: 'carto-darkmatter',
                    center: {
                        lat: loc.latitude,
                        lon: loc.longitude
                    },
                    zoom: 10
                },
                margin: { l: 0, r: 0, t: 0, b: 0 },
                paper_bgcolor: '#282828',
                font: { color: '#ffffff' }
            };
            
            Plotly.newPlot('locationMap', data, layout);
        }
        
        async function refreshPredictions() {
            try {
                let params = '';
                if (userLocation) {
                    params = `?lat=${userLocation.lat}&lon=${userLocation.lon}`;
                }
                
                const response = await fetch(`/api/weather/current-predictions${params}`);
                const data = await response.json();
                
                if (data.predictions) {
                    currentData.predictions = data.predictions;
                    updateCurrentWeather();
                }
            } catch (error) {
                console.error('Error refreshing predictions:', error);
            }
        }
    </script>
</body>
</html>
