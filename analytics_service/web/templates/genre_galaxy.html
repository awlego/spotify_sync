<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genre Galaxy Explorer - Music Visualization</title>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            overflow: hidden;
        }
        
        #galaxy-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(18, 18, 18, 0.9);
            border: 1px solid rgba(29, 185, 84, 0.3);
            border-radius: 8px;
            padding: 20px;
            max-width: 300px;
            backdrop-filter: blur(10px);
        }
        
        #info-panel h2 {
            margin-top: 0;
            color: #1db954;
            font-size: 24px;
        }
        
        #info-panel p {
            margin: 10px 0;
            color: #b3b3b3;
            font-size: 14px;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(18, 18, 18, 0.9);
            border: 1px solid rgba(29, 185, 84, 0.3);
            border-radius: 8px;
            padding: 15px;
            backdrop-filter: blur(10px);
            display: flex;
            gap: 15px;
        }
        
        button {
            background: #1db954;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: #1ed760;
            transform: scale(1.05);
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #1db954;
        }
        
        .genre-details {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .genre-details h3 {
            color: #1db954;
            margin-bottom: 10px;
        }
        
        .stat {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
        }
        
        .stat-label {
            color: #b3b3b3;
        }
        
        .stat-value {
            color: #ffffff;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="galaxy-container">
        <div id="loading">Loading your musical universe...</div>
    </div>
    
    <div id="info-panel">
        <h2>Genre Galaxy Explorer</h2>
        <p>Navigate through your musical universe. Each sphere represents a genre, sized by how much you listen to it.</p>
        <p><strong>Controls:</strong></p>
        <ul style="margin: 10px 0; padding-left: 20px; color: #b3b3b3;">
            <li>Click and drag to rotate</li>
            <li>Scroll to zoom</li>
            <li>Click a genre to explore</li>
        </ul>
        
        <div id="genre-details" class="genre-details" style="display: none;">
            <h3 id="genre-name"></h3>
            <div class="stat">
                <span class="stat-label">Total Plays:</span>
                <span class="stat-value" id="genre-plays"></span>
            </div>
            <div class="stat">
                <span class="stat-label">Parent Genre:</span>
                <span class="stat-value" id="genre-parent"></span>
            </div>
        </div>
    </div>
    
    <div id="controls">
        <button onclick="galaxy.loadData()">Refresh Data</button>
        <button onclick="toggleAutoRotate()">Toggle Rotation</button>
        <button onclick="showJourney()">Show Journey</button>
        <button onclick="resetView()">Reset View</button>
    </div>
    
    <script src="/static/js/visualizations/genre-galaxy.js"></script>
    <script>
        let galaxy;
        
        // Initialize galaxy when page loads
        window.onload = async function() {
            galaxy = new GenreGalaxy('galaxy-container');
            
            // Load data
            await galaxy.loadData();
            
            // Hide loading message
            document.getElementById('loading').style.display = 'none';
            
            // Listen for genre selection
            document.getElementById('galaxy-container').addEventListener('genreSelected', (e) => {
                const genre = e.detail;
                document.getElementById('genre-details').style.display = 'block';
                document.getElementById('genre-name').textContent = genre.name;
                document.getElementById('genre-plays').textContent = genre.play_count;
                document.getElementById('genre-parent').textContent = genre.parent || 'None';
            });
        };
        
        function toggleAutoRotate() {
            galaxy.controls.autoRotate = !galaxy.controls.autoRotate;
        }
        
        function showJourney() {
            // Show last 30 days journey
            const endDate = new Date().toISOString();
            const startDate = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString();
            galaxy.loadJourney(startDate, endDate);
        }
        
        function resetView() {
            galaxy.camera.position.set(0, 0, 200);
            galaxy.controls.reset();
        }
    </script>
</body>
</html>
