<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Analysis - Music Analytics</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(135deg, #1DB954 0%, #1ED760 100%);
            padding: 40px 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .search-section {
            background: #282828;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 40px;
            text-align: center;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        input[type="text"] {
            flex: 1;
            background: #121212;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 15px 20px;
            border-radius: 30px;
            font-size: 1.1em;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #1DB954;
        }
        
        .btn {
            background: #1DB954;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #1ED760;
            transform: scale(1.05);
        }
        
        .artist-info {
            background: #282828;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            display: none;
            text-align: center;
        }
        
        .artist-name {
            font-size: 3em;
            color: #1DB954;
            margin-bottom: 20px;
        }
        
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .stat-card {
            background: #404040;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2.5em;
            color: #1DB954;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            color: #b3b3b3;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 0.05em;
        }
        
        .viz-section {
            display: none;
        }
        
        .viz-card {
            background: #282828;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .viz-title {
            font-size: 1.8em;
            color: #1DB954;
            margin-bottom: 20px;
        }
        
        .viz-container {
            width: 100%;
            height: 400px;
            position: relative;
        }
        
        .viz-container.tall {
            height: 600px;
        }
        
        .top-songs-list {
            max-height: 600px;
            overflow-y: auto;
        }
        
        .song-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin: 10px 0;
            background: #404040;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .song-item:hover {
            background: #505050;
            transform: translateX(5px);
        }
        
        .song-rank {
            font-size: 1.5em;
            font-weight: bold;
            color: #1DB954;
            margin-right: 20px;
            min-width: 40px;
        }
        
        .song-info {
            flex: 1;
            text-align: left;
        }
        
        .song-title {
            font-size: 1.1em;
            margin-bottom: 5px;
        }
        
        .song-album {
            color: #b3b3b3;
            font-size: 0.9em;
        }
        
        .play-count {
            font-weight: bold;
            color: #1DB954;
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(29, 185, 84, 0.3);
            border-top-color: #1DB954;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            background: #ff4444;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }
        
        .back-link {
            color: #1DB954;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        
        .back-link:hover {
            color: #1ED760;
            transform: translateX(-5px);
        }
        
        @media (max-width: 768px) {
            .artist-name {
                font-size: 2em;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Artist Analysis</h1>
        <p>Deep dive into your favorite artists</p>
    </div>
    
    <div class="container">
        <a href="/" class="back-link">← Back to Dashboard</a>
        
        <div class="search-section">
            <h2 style="margin-bottom: 20px;">Search for an Artist</h2>
            <div class="search-box">
                <input type="text" id="artist-search" placeholder="Enter artist name..." />
                <button class="btn" onclick="searchArtist()">Search</button>
            </div>
        </div>
        
        <div class="artist-info" id="artist-info">
            <h2 class="artist-name" id="artist-name"></h2>
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-number" id="total-plays">-</div>
                    <div class="stat-label">Total Plays</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="days-listened">-</div>
                    <div class="stat-label">Days Listened</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="peak-month">-</div>
                    <div class="stat-label">Peak Month</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="avg-plays-day">-</div>
                    <div class="stat-label">Avg Plays/Day</div>
                </div>
            </div>
        </div>
        
        <div class="viz-section" id="viz-section">
            <!-- Top Songs -->
            <div class="viz-card">
                <h2 class="viz-title">Most Played Songs</h2>
                <div class="top-songs-list" id="top-songs-list">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
            
            <!-- Artist Calendar -->
            <div class="viz-card">
                <h2 class="viz-title">Listening Calendar</h2>
                <div style="margin-bottom: 20px;">
                    <select id="year-select" onchange="updateCalendar()">
                        <!-- Will be populated dynamically -->
                    </select>
                </div>
                <div class="viz-container tall" id="calendar-container">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
            
            <!-- Monthly Trends -->
            <div class="viz-card">
                <h2 class="viz-title">Monthly Listening Trends</h2>
                <div class="viz-container" id="monthly-container">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let currentArtist = null;
        let peakMonthData = null;
        
        // Initialize year selector
        document.addEventListener('DOMContentLoaded', () => {
            populateYearSelect();
            
            // Check if artist was passed in URL
            const params = new URLSearchParams(window.location.search);
            const artist = params.get('artist');
            if (artist) {
                document.getElementById('artist-search').value = artist;
                searchArtist();
            }
            
            // Enter key to search
            document.getElementById('artist-search').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchArtist();
            });
        });
        
        function populateYearSelect() {
            const select = document.getElementById('year-select');
            const currentYear = new Date().getFullYear();
            
            for (let year = currentYear; year >= 2015; year--) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                if (year === currentYear) option.selected = true;
                select.appendChild(option);
            }
        }
        
        async function searchArtist() {
            const artistName = document.getElementById('artist-search').value.trim();
            if (!artistName) return;
            
            currentArtist = artistName;
            
            // Show sections
            document.getElementById('artist-info').style.display = 'block';
            document.getElementById('viz-section').style.display = 'block';
            
            // Update URL
            const url = new URL(window.location);
            url.searchParams.set('artist', artistName);
            window.history.pushState({}, '', url);
            
            // Load all data
            await Promise.all([
                loadArtistInfo(),
                loadTopSongs(),
                loadArtistCalendar(),
                loadMonthlyTrends()
            ]);
        }
        
        async function loadArtistInfo() {
            try {
                // Get artist consistency info
                const response = await fetch('/api/analytics/consistent-artists?limit=100');
                const data = await response.json();
                
                const artistData = data.consistent_artists.find(
                    a => a.artist_name.toLowerCase() === currentArtist.toLowerCase()
                );
                
                if (artistData) {
                    document.getElementById('artist-name').textContent = artistData.artist_name;
                    document.getElementById('total-plays').textContent = artistData.total_plays.toLocaleString();
                    document.getElementById('days-listened').textContent = artistData.days_listened;
                    document.getElementById('avg-plays-day').textContent = artistData.avg_plays_per_day;
                } else {
                    document.getElementById('artist-name').textContent = currentArtist;
                    document.getElementById('total-plays').textContent = '-';
                    document.getElementById('days-listened').textContent = '-';
                    document.getElementById('avg-plays-day').textContent = '-';
                }
                
                // Get peak month
                const peakResponse = await fetch(`/api/analytics/artist/${encodeURIComponent(currentArtist)}/peak-month`);
                const peakData = await peakResponse.json();
                
                if (!peakData.error) {
                    peakMonthData = peakData;
                    document.getElementById('peak-month').textContent = peakData.peak_month.month_name;
                } else {
                    document.getElementById('peak-month').textContent = '-';
                }
                
            } catch (error) {
                console.error('Error loading artist info:', error);
            }
        }
        
        async function loadTopSongs() {
            try {
                const response = await fetch(`/api/analytics/artist/${encodeURIComponent(currentArtist)}/songs?limit=50`);
                const data = await response.json();
                
                const container = document.getElementById('top-songs-list');
                
                if (data.songs && data.songs.length > 0) {
                    container.innerHTML = data.songs.map((song, index) => `
                        <div class="song-item">
                            <div class="song-rank">${index + 1}</div>
                            <div class="song-info">
                                <div class="song-title">${song.track_name}</div>
                                <div class="song-album">${song.album_name || 'Unknown Album'}</div>
                            </div>
                            <div class="play-count">${song.play_count} plays</div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<div class="error">No songs found for this artist</div>';
                }
                
            } catch (error) {
                console.error('Error loading top songs:', error);
                document.getElementById('top-songs-list').innerHTML = 
                    '<div class="error">Failed to load songs</div>';
            }
        }
        
        async function loadArtistCalendar() {
            const year = document.getElementById('year-select').value;
            
            try {
                const response = await fetch(`/api/visualizations/artist-calendar/${encodeURIComponent(currentArtist)}?year=${year}`);
                const data = await response.json();
                
                if (data.chart) {
                    const chart = JSON.parse(data.chart);
                    Plotly.newPlot('calendar-container', chart.data, chart.layout, {
                        responsive: true,
                        displayModeBar: false
                    });
                } else {
                    document.getElementById('calendar-container').innerHTML = 
                        '<div class="error">No data available for this year</div>';
                }
                
            } catch (error) {
                console.error('Error loading calendar:', error);
                document.getElementById('calendar-container').innerHTML = 
                    '<div class="error">Failed to load calendar</div>';
            }
        }
        
        async function loadMonthlyTrends() {
            if (!peakMonthData || !peakMonthData.all_months) {
                // Try to load it if we don't have it
                try {
                    const response = await fetch(`/api/analytics/artist/${encodeURIComponent(currentArtist)}/peak-month`);
                    peakMonthData = await response.json();
                } catch (error) {
                    console.error('Error loading monthly trends:', error);
                    return;
                }
            }
            
            if (peakMonthData && peakMonthData.all_months) {
                const months = peakMonthData.all_months;
                
                const trace = {
                    x: months.map(m => m.month_name),
                    y: months.map(m => m.play_count),
                    type: 'bar',
                    marker: {
                        color: months.map(m => 
                            m.month_name === peakMonthData.peak_month.month_name ? '#1DB954' : '#404040'
                        )
                    }
                };
                
                const layout = {
                    title: '',
                    xaxis: { 
                        title: 'Month',
                        tickangle: -45
                    },
                    yaxis: { title: 'Play Count' },
                    paper_bgcolor: '#282828',
                    plot_bgcolor: '#282828',
                    font: { color: '#ffffff' },
                    margin: { b: 100 }
                };
                
                Plotly.newPlot('monthly-container', [trace], layout, {
                    responsive: true,
                    displayModeBar: false
                });
            }
        }
        
        function updateCalendar() {
            if (currentArtist) {
                loadArtistCalendar();
            }
        }
    </script>
</body>
</html>
