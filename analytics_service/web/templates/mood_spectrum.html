<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Spectrum Analyzer - Musical Emotions</title>
    
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1 {
            color: #1db954;
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #b3b3b3;
            font-size: 18px;
            margin-bottom: 30px;
        }
        
        .controls {
            background: #282828;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        label {
            color: #b3b3b3;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        select, input[type="date"] {
            background: #121212;
            color: #ffffff;
            border: 1px solid #404040;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }
        
        button {
            background: #1db954;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: #1ed760;
            transform: scale(1.05);
        }
        
        .visualization-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .viz-card {
            background: #282828;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        .viz-card h2 {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .chart-container {
            width: 100%;
            height: 400px;
            position: relative;
        }
        
        .insights-panel {
            background: #282828;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        .insights-panel h2 {
            color: #1db954;
            font-size: 24px;
            margin-bottom: 20px;
        }
        
        .mood-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .mood-item {
            background: #121212;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        
        .mood-item:hover {
            border-color: #1db954;
        }
        
        .mood-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        
        .mood-percentage {
            font-size: 24px;
            font-weight: bold;
        }
        
        .mood-count {
            color: #b3b3b3;
            font-size: 14px;
        }
        
        .insight-list {
            list-style: none;
            padding: 0;
        }
        
        .insight-list li {
            padding: 10px 0;
            border-bottom: 1px solid #404040;
            color: #b3b3b3;
        }
        
        .insight-list li:last-child {
            border-bottom: none;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #b3b3b3;
        }
        
        .error {
            background: #ff4444;
            color: white;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
        }
        
        @media (min-width: 768px) {
            .visualization-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (min-width: 1200px) {
            .controls {
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mood Spectrum Analyzer</h1>
        <p class="subtitle">Explore the emotional journey of your music</p>
        
        <div class="controls">
            <div class="control-group">
                <label for="period">Time Period</label>
                <select id="period" onchange="updatePeriod()">
                    <option value="7">Last 7 days</option>
                    <option value="30" selected>Last 30 days</option>
                    <option value="90">Last 90 days</option>
                    <option value="365">Last year</option>
                    <option value="custom">Custom range</option>
                </select>
            </div>
            
            <div class="control-group" id="customRange" style="display: none;">
                <label>Date Range</label>
                <div style="display: flex; gap: 10px;">
                    <input type="date" id="startDate">
                    <input type="date" id="endDate">
                </div>
            </div>
            
            <button onclick="loadMoodData()">Update Analysis</button>
            <button onclick="exportData()">Export Data</button>
        </div>
        
        <div class="insights-panel">
            <h2>Mood Summary</h2>
            <div id="moodSummary" class="mood-summary">
                <div class="loading">Loading mood analysis...</div>
            </div>
            <div id="insightsList"></div>
        </div>
        
        <div class="visualization-grid">
            <div class="viz-card">
                <h2>Emotional Timeline</h2>
                <div id="timelineChart" class="chart-container"></div>
            </div>
            
            <div class="viz-card">
                <h2>Daily Mood Patterns</h2>
                <div id="wheelChart" class="chart-container"></div>
            </div>
            
            <div class="viz-card">
                <h2>Weekly Mood Heatmap</h2>
                <div id="heatmapChart" class="chart-container"></div>
            </div>
            
            <div class="viz-card">
                <h2>Mood Transitions</h2>
                <div id="transitionsChart" class="chart-container"></div>
            </div>
        </div>
    </div>
    
    <script>
        let currentData = {
            timeline: [],
            patterns: {},
            summary: {}
        };
        
        // Initialize on page load
        window.onload = function() {
            loadMoodData();
        };
        
        function updatePeriod() {
            const period = document.getElementById('period').value;
            const customRange = document.getElementById('customRange');
            
            if (period === 'custom') {
                customRange.style.display = 'flex';
                // Set default dates
                const endDate = new Date();
                const startDate = new Date();
                startDate.setDate(endDate.getDate() - 30);
                
                document.getElementById('startDate').value = startDate.toISOString().split('T')[0];
                document.getElementById('endDate').value = endDate.toISOString().split('T')[0];
            } else {
                customRange.style.display = 'none';
            }
        }
        
        async function loadMoodData() {
            try {
                // Show loading state
                showLoading();
                
                // Determine date range
                const period = document.getElementById('period').value;
                let startDate, endDate;
                
                if (period === 'custom') {
                    startDate = document.getElementById('startDate').value;
                    endDate = document.getElementById('endDate').value;
                } else {
                    endDate = new Date();
                    startDate = new Date();
                    startDate.setDate(endDate.getDate() - parseInt(period));
                    startDate = startDate.toISOString();
                    endDate = endDate.toISOString();
                }
                
                // Fetch all mood data in parallel
                const [timelineRes, patternsRes, summaryRes] = await Promise.all([
                    fetch(`/api/visualizations/mood-timeline?start_date=${startDate}&end_date=${endDate}`),
                    fetch('/api/visualizations/mood-patterns'),
                    fetch(`/api/insights/mood-analysis?days=${period === 'custom' ? 90 : period}`)
                ]);
                
                currentData.timeline = (await timelineRes.json()).timeline;
                currentData.patterns = await patternsRes.json();
                currentData.summary = await summaryRes.json();
                
                // Update all visualizations
                updateMoodSummary();
                updateTimeline();
                updateMoodWheel();
                updateHeatmap();
                updateTransitions();
                
            } catch (error) {
                console.error('Error loading mood data:', error);
                showError('Failed to load mood analysis. Please try again.');
            }
        }
        
        function showLoading() {
            document.getElementById('moodSummary').innerHTML = '<div class="loading">Loading mood analysis...</div>';
            document.getElementById('timelineChart').innerHTML = '<div class="loading">Loading...</div>';
            document.getElementById('wheelChart').innerHTML = '<div class="loading">Loading...</div>';
            document.getElementById('heatmapChart').innerHTML = '<div class="loading">Loading...</div>';
            document.getElementById('transitionsChart').innerHTML = '<div class="loading">Loading...</div>';
        }
        
        function showError(message) {
            const errorDiv = `<div class="error">${message}</div>`;
            document.getElementById('moodSummary').innerHTML = errorDiv;
        }
        
        function updateMoodSummary() {
            const summary = currentData.summary;
            const distribution = summary.distribution || {};
            const insights = summary.insights || [];
            
            // Create mood items
            let moodHtml = '';
            for (const [mood, data] of Object.entries(distribution)) {
                moodHtml += `
                    <div class="mood-item" style="border-color: ${data.color}20;">
                        <div class="mood-name" style="color: ${data.color};">${mood.charAt(0).toUpperCase() + mood.slice(1)}</div>
                        <div class="mood-percentage" style="color: ${data.color};">${data.percentage}%</div>
                        <div class="mood-count">${data.count} tracks</div>
                    </div>
                `;
            }
            
            document.getElementById('moodSummary').innerHTML = moodHtml;
            
            // Update insights
            if (insights.length > 0) {
                let insightsHtml = '<h3>Insights</h3><ul class="insight-list">';
                insights.forEach(insight => {
                    insightsHtml += `<li>${insight}</li>`;
                });
                insightsHtml += '</ul>';
                document.getElementById('insightsList').innerHTML = insightsHtml;
            }
        }
        
        function updateTimeline() {
            if (!currentData.timeline || currentData.timeline.length === 0) {
                document.getElementById('timelineChart').innerHTML = '<div class="loading">No timeline data available</div>';
                return;
            }
            
            // The timeline chart would be created server-side
            // For now, create a simple visualization
            fetch('/api/visualizations/mood-timeline', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({timeline: currentData.timeline})
            })
            .then(res => res.json())
            .then(data => {
                if (data.chart) {
                    Plotly.newPlot('timelineChart', data.chart.data, data.chart.layout);
                }
            });
        }
        
        function updateMoodWheel() {
            // Create mood wheel visualization
            const patterns = currentData.patterns;
            if (!patterns.hourly_pattern) {
                document.getElementById('wheelChart').innerHTML = '<div class="loading">No pattern data available</div>';
                return;
            }
            
            // This would typically call a server endpoint to generate the chart
            // For demonstration, we'll create a simple placeholder
            const data = [{
                type: 'scatterpolar',
                r: [30, 45, 60, 50, 40, 35, 30, 25, 20, 25, 30, 40],
                theta: ['00:00', '02:00', '04:00', '06:00', '08:00', '10:00', 
                        '12:00', '14:00', '16:00', '18:00', '20:00', '22:00'],
                fill: 'toself',
                name: 'Mood Intensity'
            }];
            
            const layout = {
                polar: {
                    radialaxis: {
                        visible: true,
                        range: [0, 100]
                    }
                },
                showlegend: false,
                paper_bgcolor: '#282828',
                plot_bgcolor: '#282828',
                font: { color: '#ffffff' }
            };
            
            Plotly.newPlot('wheelChart', data, layout);
        }
        
        function updateHeatmap() {
            // Similar implementation for heatmap
            document.getElementById('heatmapChart').innerHTML = '<div class="loading">Heatmap visualization coming soon</div>';
        }
        
        function updateTransitions() {
            const transitions = currentData.patterns.common_transitions || [];
            if (transitions.length === 0) {
                document.getElementById('transitionsChart').innerHTML = '<div class="loading">No transition data available</div>';
                return;
            }
            
            // Create a simple bar chart of common transitions
            const transitionNames = transitions.slice(0, 10).map(t => `${t.from} → ${t.to}`);
            const transitionCounts = transitions.slice(0, 10).map(t => t.count);
            
            const data = [{
                type: 'bar',
                x: transitionCounts,
                y: transitionNames,
                orientation: 'h',
                marker: { color: '#1db954' }
            }];
            
            const layout = {
                title: '',
                xaxis: { title: 'Frequency' },
                yaxis: { title: '' },
                margin: { l: 150 },
                paper_bgcolor: '#282828',
                plot_bgcolor: '#282828',
                font: { color: '#ffffff' }
            };
            
            Plotly.newPlot('transitionsChart', data, layout);
        }
        
        function exportData() {
            // Export mood data as JSON
            const dataStr = JSON.stringify(currentData, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `mood_analysis_${new Date().toISOString().split('T')[0]}.json`;
            link.click();
        }
    </script>
</body>
</html>
